[package]
name = "myna-sign-app"
description = "The myna-sign desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Tauri's mobile targets want a library; the desktop binary is a thin wrapper over it.
name = "myna_sign_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `cargo tauri build` enables this so the Vite output is embedded in the executable. Development
# builds leave it off and use the server configured by `build.devUrl`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
myna-sign = { path = "..", default-features = false, features = ["tsa-http"] }
myna-card = { version = "3.3", default-features = false, features = ["pcsc", "verify"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1.9", features = ["zeroize_derive"] }
hex = "0.4"
