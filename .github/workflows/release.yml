name: Release

# Tag a commit to release it:
#
#     git tag v1.0.0 && git push origin v0.1.0
#
# The tag has to match the version, which this project states in three places — the workspace
# manifest, the application manifest, and `tauri.conf.json`, whose copy is the one that ends up in
# the installer and in the window's About box. The first job checks all three before anything is
# built.
#
# The jobs run in this order, and the order is the point:
#
#     verify ──► bundle (ubuntu, macOS, Windows) ──► a draft release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: The tag and all three versions must agree
        id: version
        run: |
          set -euo pipefail
          workspace=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          app=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          # The one the installer and the About box carry.
          conf=$(grep -m1 '"version"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "workspace $workspace, app $app, tauri.conf.json $conf"
          if [ "$workspace" != "$app" ] || [ "$workspace" != "$conf" ]; then
            echo "::error::the three versions disagree"
            exit 1
          fi
          echo "version=$workspace" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "manual run, the manifests say $workspace"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$workspace" ]; then
            echo "::error::tag v$tag does not match the declared version $workspace"
            exit 1
          fi

      - name: Tools that judge our output
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev gnupg poppler-utils openssl

      # A release must not ship anything the outside verifiers have not passed on. The tests skip
      # when a tool is missing, so their presence is checked rather than assumed.
      - name: The judges have to actually be here
        run: |
          set -euo pipefail
          for tool in gpg pdfsig openssl; do
            path=$(command -v "$tool") || {
              echo "::error::$tool is missing, so the interop tests would skip and pass"
              exit 1
            }
            # `pdfsig` has no --version; it reads the argument as a file name. Print whatever a
            # tool will tell us, and its path when it will not — which version judged the output
            # is the first thing worth knowing when this job fails.
            version=$("$tool" --version 2>/dev/null | head -1 || true)
            echo "$tool: ${version:-$path}"
          done

      - name: Test
        run: cargo test --workspace --features myna-sign-core/soft-signer

  bundle:
    name: Installers (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # `tauri.conf.json` lists the bundle targets; each runner produces the ones it can.
        # Linux gives deb and appimage, macOS an app and a dmg, Windows msi and nsis.
        # `macos-14` is Apple Silicon, which is the only macOS architecture this project targets —
        # an Intel build would need its own runner and its own line here.
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux webview and PC/SC
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libpcsclite-dev

      # `beforeBuildCommand` runs `npm --prefix ../ui run build`, which needs the dependencies to
      # already be there. Nothing else installs them: there is no package.json at the repository
      # root for the action to find.
      - name: Front end dependencies
        run: npm ci
        working-directory: ui

      # Bundling is `cargo tauri build`, which turns `custom-protocol` on by itself — the front end
      # ends up inside the binary rather than being fetched from a dev server that will not be
      # running on anybody else's machine.
      #
      # Unsigned. `tauri.conf.json` carries no signing identity and no notarisation credentials,
      # so macOS will refuse these on first open until the user allows them by hand, and Windows
      # SmartScreen will warn. That is why the release is a draft: publishing it is a decision.
      #
      # `releaseDraft: true` is load-bearing beyond the draft itself: since v1 the action fails
      # rather than uploads when the release it finds is already published. Re-running a tag whose
      # release someone has published stops here instead of quietly replacing what people have
      # been downloading.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: myna-sign ${{ needs.verify.outputs.version }}
          releaseDraft: true
          prerelease: false
          releaseBody: |
            署名用電子証明書での署名と、その検証。

            **これらのインストーラはコード署名されていません。** macOS は初回起動を拒否し、
            Windows SmartScreen は警告を出します。

            動作には PC/SC が必要です。Linux では `pcscd` と `libpcsclite1`、
            macOS と Windows は OS 内蔵のものを使います。
