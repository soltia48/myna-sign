version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  # The root lockfile covers the library, CLI, and Tauri workspace member. Keeping one Cargo
  # entry avoids duplicate pull requests for the same dependency update.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    groups:
      patch-and-minor:
        update-types: [minor, patch]

    # cms 0.2 and x509-tsp 0.1 use the der 0.7 / x509-cert 0.2 generation. Updating one crate in
    # isolation compiles two incompatible ASN.1 type families. Move this set together once both
    # protocol crates support the newer generation.
    ignore:
      - dependency-name: der
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: spki
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: x509-cert
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: sha2
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: p521
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: p256
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: p384
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: rand
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: signature
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    groups:
      patch-and-minor:
        update-types: [minor, patch]
