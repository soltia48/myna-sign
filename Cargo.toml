[workspace]
resolver = "3"
members = ["src-tauri"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/soltia48/myna-sign"

[package]
name = "myna-sign"
description = "Sign and verify files with the signing certificate on a Japanese Individual Number Card."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
default-run = "myna-sign"

[[bin]]
name = "myna-sign"
path = "src/bin/cli.rs"

[dependencies]
# Certificate parsing and J-LIS trust anchors are used by verification; PC/SC is used only by
# `card`, but keeping both in this package gives the CLI and desktop app one shared card layer.
myna-card = { version = "3.3", default-features = false, features = ["pcsc", "verify"] }
pcsc = "2.9"

thiserror = "2"
sha2 = "0.10"
rsa = "0.9"
p256 = "0.13"
p384 = "0.13"
p521 = "0.13"
signature = "2"
zeroize = { version = "1.9", features = ["zeroize_derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.8"
webpki-roots = "1.0"
cmpv2 = "0.2"
anyhow = "1"
ureq = { version = "3.4", default-features = false, features = ["rustls"], optional = true }
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
rpassword = "7"

# CMS and x509-tsp still use the `der` 0.7 / `x509-cert` 0.2 generation. myna-card uses
# x509-cert 0.3; only encoded DER crosses that boundary.
der = { version = "0.7", features = ["derive", "oid"] }
spki = "0.7"
x509-cert = "0.2"
cms = { version = "0.2", features = ["builder"] }
x509-tsp = "0.1"
lopdf = { version = "0.44", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ab_glyph = "0.2"

sequoia-openpgp = { version = "2.4", default-features = false, features = [
    "crypto-rust",
    "allow-experimental-crypto",
    "allow-variable-time-crypto",
] }

[features]
# The CLI exposes `--soft-key`, so its software signer is part of the root package's normal build.
# The desktop member disables root defaults and enables only the timestamp transport it uses.
default = ["soft-signer", "tsa-http"]
soft-signer = ["x509-cert/builder"]
tsa-http = ["dep:ureq"]

[profile.release]
strip = true
